<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>米宝的地洞惊喜游戏</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #c7f0ff 0%, #fff5c9 100%);
      font-family: "Microsoft YaHei", sans-serif;
    }

    .game-box {
      width: 760px;
      max-width: 95vw;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: #ff6b6b;
      font-size: 34px;
    }

    .info-bar {
      margin-bottom: 14px;
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      font-size: 24px;
      font-weight: bold;
      color: #444;
    }

    #status {
      color: #2f7d32;
    }

    .board {
      position: relative;
      padding: 24px;
      border: 4px solid #7f5539;
      border-radius: 24px;
      background: linear-gradient(180deg, #8fd694 0%, #67b26f 100%);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.15);
    }

    .holes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .hole {
      position: relative;
      height: 150px;
      border-radius: 24px;
      background: linear-gradient(180deg, #9be7ff 0%, #d9f6ff 48%, #8b5a3c 49%, #5a3825 100%);
      overflow: hidden;
    }

    .pit {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 120px;
      height: 46px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #3a2417;
      box-shadow: inset 0 10px 14px rgba(0, 0, 0, 0.35);
    }

    .item {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%) translateY(100px);
      width: 84px;
      height: 84px;
      border: none;
      background: transparent;
      font-size: 54px;
      cursor: pointer;
      transition: transform 0.2s ease;
      display: none;
    }

    .item.show {
      display: block;
      transform: translateX(-50%) translateY(0);
    }

    .item:disabled {
      cursor: default;
    }

    .message {
      min-height: 28px;
      margin-top: 14px;
      color: #5d4037;
      font-size: 20px;
      font-weight: bold;
    }

    .tip {
      margin-top: 12px;
      color: #555;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="game-box">
    <h1>米宝的地洞惊喜游戏</h1>

    <div class="info-bar">
      <div>得分：<span id="score">0</span></div>
      <div>时间：<span id="time">60</span> 秒</div>
      <div id="status">状态：正常</div>
    </div>

    <div class="board">
      <div class="holes" id="holes"></div>
    </div>

    <div id="message" class="message">地鼠、炸弹、钻石都会随机冒出来。</div>
    <div class="tip">点到地鼠加 1 分，点到炸弹会暂停 5 秒，点到钻石加 5 分。</div>
  </div>

  <script>
    const holes = document.getElementById("holes");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const statusText = document.getElementById("status");
    const messageText = document.getElementById("message");

    const itemTypes = [
      { name: "mole", emoji: "🐹", weight: 5 },
      { name: "bomb", emoji: "💣", weight: 2 },
      { name: "diamond", emoji: "💎", weight: 2 }
    ];

    const holeCount = 6;
    const showTime = 1200;
    const nextTime = 900;

    let score = 0;
    let timeLeft = 60;
    let gameOver = false;
    let paused = false;
    let activeHoleIndex = -1;
    let activeType = "";
    let roundTimer = null;
    let clockTimer = null;
    let pauseTimer = null;

    // 创建地洞
    for (let i = 0; i < holeCount; i = i + 1) {
      const hole = document.createElement("div");
      hole.className = "hole";

      const pit = document.createElement("div");
      pit.className = "pit";

      const item = document.createElement("button");
      item.className = "item";
      item.dataset.index = i;

      item.addEventListener("click", function () {
        hitItem(i);
      });

      hole.appendChild(item);
      hole.appendChild(pit);
      holes.appendChild(hole);
    }

    const itemButtons = document.querySelectorAll(".item");

    // 更新分数
    function updateScore() {
      scoreText.textContent = score;
    }

    // 更新时间
    function updateTime() {
      timeText.textContent = timeLeft;
    }

    // 显示提示文字
    function showMessage(text) {
      messageText.textContent = text;
    }

    // 随机挑一个类型
    function getRandomType() {
      let total = 0;

      for (const item of itemTypes) {
        total = total + item.weight;
      }

      let random = Math.random() * total;

      for (const item of itemTypes) {
        random = random - item.weight;

        if (random <= 0) {
          return item;
        }
      }

      return itemTypes[0];
    }

    // 随机挑一个地洞
    function getRandomHoleIndex() {
      return Math.floor(Math.random() * holeCount);
    }

    // 先把所有东西藏起来
    function hideAllItems() {
      itemButtons.forEach(function (button) {
        button.classList.remove("show");
        button.style.display = "none";
        button.textContent = "";
        button.dataset.type = "";
        button.disabled = true;
      });

      activeHoleIndex = -1;
      activeType = "";
    }

    // 随机显示一个东西
    function showRandomItem() {
      if (gameOver || paused) {
        return;
      }

      hideAllItems();

      const holeIndex = getRandomHoleIndex();
      const item = getRandomType();
      const button = itemButtons[holeIndex];

      activeHoleIndex = holeIndex;
      activeType = item.name;

      button.textContent = item.emoji;
      button.dataset.type = item.name;
      button.style.display = "block";
      button.disabled = false;

      setTimeout(function () {
        button.classList.add("show");
      }, 10);

      roundTimer = setTimeout(function () {
        hideAllItems();

        if (!gameOver && !paused) {
          roundTimer = setTimeout(showRandomItem, nextTime);
        }
      }, showTime);
    }

    // 点到了东西以后做不同处理
    function hitItem(index) {
      if (gameOver || paused || index !== activeHoleIndex) {
        return;
      }

      const button = itemButtons[index];
      const type = button.dataset.type;

      clearTimeout(roundTimer);
      hideAllItems();

      if (type === "mole") {
        score = score + 1;
        updateScore();
        showMessage("打到地鼠了，加 1 分。");
        roundTimer = setTimeout(showRandomItem, nextTime);
        return;
      }

      if (type === "diamond") {
        score = score + 5;
        updateScore();
        showMessage("太棒了，钻石加了 5 分。");
        roundTimer = setTimeout(showRandomItem, nextTime);
        return;
      }

      if (type === "bomb") {
        paused = true;
        statusText.textContent = "状态：暂停 5 秒";
        showMessage("哎呀，点到炸弹了，暂停 5 秒。");

        pauseTimer = setTimeout(function () {
          paused = false;
          statusText.textContent = "状态：正常";
          showMessage("游戏继续，加油。");

          if (!gameOver) {
            showRandomItem();
          }
        }, 5000);
      }
    }

    // 倒计时
    function startClock() {
      clockTimer = setInterval(function () {
        if (gameOver) {
          return;
        }

        timeLeft = timeLeft - 1;
        updateTime();

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    // 游戏结束
    function endGame() {
      gameOver = true;
      clearTimeout(roundTimer);
      clearTimeout(pauseTimer);
      clearInterval(clockTimer);
      hideAllItems();
      statusText.textContent = "状态：游戏结束";
      showMessage("时间到。你最后得了 " + score + " 分。");
    }

    updateScore();
    updateTime();
    showRandomItem();
    startClock();
  </script>
</body>
</html>
