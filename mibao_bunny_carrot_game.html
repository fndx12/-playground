<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>米宝的小兔子吃胡萝卜</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #bfefff 0%, #f7ffe0 100%);
      font-family: "Microsoft YaHei", sans-serif;
    }

    .game-box {
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: #ff6b6b;
      font-size: 34px;
    }

    .info-bar {
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      gap: 28px;
      color: #444;
      font-size: 24px;
      font-weight: bold;
    }

    #game {
      position: relative;
      width: 600px;
      height: 400px;
      border: 4px solid #7ac74f;
      border-radius: 18px;
      background: linear-gradient(180deg, #dff6ff 0%, #c8f7c5 65%, #a8e6a1 100%);
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    }

    .bunny,
    .carrot,
    .message {
      position: absolute;
    }

    .carrot {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      user-select: none;
    }

    .bunny {
      width: 64px;
      height: 72px;
      user-select: none;
    }

    .bunny-head {
      position: absolute;
      top: 0;
      left: 10px;
      font-size: 42px;
      line-height: 1;
    }

    .bunny-body {
      position: absolute;
      left: 18px;
      top: 36px;
      width: 28px;
      height: 24px;
      border-radius: 16px;
      background: #ffffff;
      border: 2px solid #f2c6de;
    }

    .bunny-feet {
      position: absolute;
      left: 20px;
      top: 58px;
      font-size: 16px;
      letter-spacing: 4px;
      color: #ff9eb5;
    }

    .message {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 22px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      color: #ff6b6b;
      font-size: 28px;
      font-weight: bold;
      display: none;
    }

    .tip {
      margin-top: 12px;
      color: #555;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="game-box">
    <h1>米宝的小兔子吃胡萝卜</h1>
    <div class="info-bar">
      <div>当前得分：<span id="score">0</span></div>
      <div>剩余时间：<span id="time">60</span> 秒</div>
    </div>

    <div id="game">
      <div id="bunny" class="bunny">
        <div class="bunny-head">🐰</div>
        <div class="bunny-body"></div>
        <div class="bunny-feet">● ●</div>
      </div>
      <div id="carrot" class="carrot">🥕</div>
      <div id="message" class="message"></div>
    </div>

    <div class="tip">按键盘方向键，帮助小兔子在 1 分钟内尽量多吃胡萝卜吧。</div>
  </div>

  <script>
    // 先找到页面上的元素
    const game = document.getElementById("game");
    const bunny = document.getElementById("bunny");
    const carrot = document.getElementById("carrot");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const message = document.getElementById("message");

    // 游戏区域大小
    const gameWidth = 600;
    const gameHeight = 400;

    // 角色大小
    const bunnyWidth = 64;
    const bunnyHeight = 72;
    const carrotSize = 48;

    // 小兔子的起始位置和速度
    const bunnyData = {
      x: 100,
      y: 100,
      speed: 10
    };

    let score = 0;
    let timeLeft = 60;
    let gameOver = false;
    let carrotTimer = null;
    let clockTimer = null;

    // 把小兔子画到新位置
    function drawBunny() {
      bunny.style.left = bunnyData.x + "px";
      bunny.style.top = bunnyData.y + "px";
    }

    // 让胡萝卜随机出现在游戏区域中
    function moveCarrot() {
      if (gameOver) {
        return;
      }

      const maxX = gameWidth - carrotSize;
      const maxY = gameHeight - carrotSize;

      const randomX = Math.floor(Math.random() * (maxX + 1));
      const randomY = Math.floor(Math.random() * (maxY + 1));

      carrot.style.left = randomX + "px";
      carrot.style.top = randomY + "px";
      carrot.style.display = "flex";
    }

    // 更新分数显示
    function updateScore() {
      scoreText.textContent = score;
    }

    // 更新剩余时间
    function updateTime() {
      timeText.textContent = timeLeft;
    }

    // 显示结束文字
    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    // 游戏结束时停止计时
    function endGame() {
      gameOver = true;
      clearInterval(clockTimer);
      clearInterval(carrotTimer);
      carrot.style.display = "none";
      showMessage("时间到啦，你得了 " + score + " 分！");
    }

    // 胡萝卜每 30 秒换一个新位置
    function startCarrotLoop() {
      carrotTimer = setInterval(function () {
        carrot.style.display = "none";

        setTimeout(function () {
          moveCarrot();
        }, 300);
      }, 30000);
    }

    // 开始一分钟倒计时
    function startClock() {
      clockTimer = setInterval(function () {
        timeLeft = timeLeft - 1;
        updateTime();

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    // 检查小兔子有没有碰到胡萝卜
    function checkEatCarrot() {
      if (gameOver || carrot.style.display === "none") {
        return;
      }

      const bunnyLeft = bunnyData.x;
      const bunnyTop = bunnyData.y;
      const bunnyRight = bunnyLeft + bunnyWidth;
      const bunnyBottom = bunnyTop + bunnyHeight;

      const carrotLeft = carrot.offsetLeft;
      const carrotTop = carrot.offsetTop;
      const carrotRight = carrotLeft + carrotSize;
      const carrotBottom = carrotTop + carrotSize;

      const isTouching =
        bunnyRight > carrotLeft &&
        bunnyLeft < carrotRight &&
        bunnyBottom > carrotTop &&
        bunnyTop < carrotBottom;

      if (isTouching) {
        score = score + 1;
        updateScore();
        moveCarrot();
      }
    }

    // 监听键盘，按方向键时移动小兔子
    document.addEventListener("keydown", function (event) {
      if (gameOver) {
        return;
      }

      if (event.key === "ArrowUp") {
        bunnyData.y = bunnyData.y - bunnyData.speed;
      }

      if (event.key === "ArrowDown") {
        bunnyData.y = bunnyData.y + bunnyData.speed;
      }

      if (event.key === "ArrowLeft") {
        bunnyData.x = bunnyData.x - bunnyData.speed;
      }

      if (event.key === "ArrowRight") {
        bunnyData.x = bunnyData.x + bunnyData.speed;
      }

      // 不让小兔子跑出游戏区域
      if (bunnyData.x < 0) {
        bunnyData.x = 0;
      }
      if (bunnyData.y < 0) {
        bunnyData.y = 0;
      }
      if (bunnyData.x > gameWidth - bunnyWidth) {
        bunnyData.x = gameWidth - bunnyWidth;
      }
      if (bunnyData.y > gameHeight - bunnyHeight) {
        bunnyData.y = gameHeight - bunnyHeight;
      }

      drawBunny();
      checkEatCarrot();
    });

    // 游戏开始时先显示一次
    drawBunny();
    moveCarrot();
    updateScore();
    updateTime();
    startClock();
    startCarrotLoop();
  </script>
</body>
</html>
