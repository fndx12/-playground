<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的游戏大厅</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --ink: #172033;
      --muted: #667085;
      --card: #ffffff;
      --line: #d9e0ea;
      --blue: #2f80ed;
      --green: #2fb66d;
      --yellow: #ffd66b;
      --shadow: 0 16px 38px rgba(23, 32, 51, 0.12);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 214, 107, 0.5), transparent 26%),
        radial-gradient(circle at 90% 14%, rgba(47, 128, 237, 0.16), transparent 24%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 55%, #edf7f0 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 15px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 620px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.7;
    }

    .count {
      min-width: 116px;
      padding: 14px 18px;
      border: 1px solid rgba(47, 128, 237, 0.22);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.68);
      text-align: center;
      box-shadow: 0 10px 22px rgba(47, 128, 237, 0.08);
    }

    .count strong {
      display: block;
      color: var(--blue);
      font-size: 34px;
      line-height: 1;
    }

    .count span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .hero-tools {
      display: grid;
      grid-template-columns: minmax(150px, auto) 116px;
      gap: 12px;
      align-items: stretch;
    }

    .player-control {
      display: grid;
      gap: 7px;
      min-width: 150px;
      padding: 12px 14px;
      border: 1px solid rgba(47, 182, 109, 0.28);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 10px 22px rgba(47, 182, 109, 0.08);
    }

    .player-control label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .player-control select {
      width: 100%;
      min-height: 42px;
      padding: 7px 34px 7px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .player-control select:focus-visible {
      outline: 3px solid rgba(47, 128, 237, 0.24);
      outline-offset: 2px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .game-card {
      min-height: 210px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .game-art {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background: linear-gradient(135deg, var(--accent-soft), rgba(255, 255, 255, 0.88));
      border-bottom: 1px solid rgba(217, 224, 234, 0.72);
    }

    .game-icon {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.9);
      font-size: 36px;
      box-shadow: 0 8px 18px rgba(23, 32, 51, 0.08);
    }

    .game-number {
      color: rgba(23, 32, 51, 0.24);
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
    }

    .game-body {
      display: grid;
      gap: 18px;
      padding: 18px;
    }

    .game-name {
      margin: 0;
      min-height: 52px;
      display: flex;
      align-items: center;
      font-size: 21px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .start-button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 8px;
      background: var(--ink);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    .start-button:hover {
      transform: translateY(-2px);
      background: #26344d;
      box-shadow: 0 10px 22px rgba(23, 32, 51, 0.18);
    }

    .start-button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .empty {
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 680px) {
      .page {
        width: min(100% - 22px, 520px);
        padding: 26px 0 32px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 16px;
        margin-bottom: 20px;
      }

      .count {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        text-align: left;
      }

      .hero-tools {
        grid-template-columns: minmax(0, 1fr) minmax(110px, 0.7fr);
      }

      .player-control {
        min-width: 0;
      }

      .count span {
        margin-top: 0;
      }

      .games {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .game-card {
        min-height: 190px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="hall-title">
      <div>
        <p class="eyebrow">HTML Games</p>
        <h1 id="hall-title">我的游戏大厅</h1>
        <p class="subtitle">这里整理了当前项目里的 HTML 小游戏。点击卡片里的按钮，就可以直接开始玩。</p>
      </div>
      <div class="hero-tools">
        <div class="player-control">
          <label for="familyPlayerSelect">当前玩家</label>
          <select id="familyPlayerSelect">
            <option value="爸爸">爸爸</option>
            <option value="婠婠">婠婠</option>
            <option value="米宝">米宝</option>
          </select>
        </div>
        <div class="count" aria-label="游戏数量">
          <strong id="gameCount">0</strong>
          <span>个小游戏</span>
        </div>
      </div>
    </section>

    <section id="games" class="games" aria-label="游戏列表"></section>
  </main>

  <script>
    const games = [
      {
        name: "米宝的小兔子吃胡萝卜",
        file: "mibao_bunny_carrot_game.html",
        icon: "🥕",
        color: "rgba(255, 214, 107, 0.5)"
      },
      {
        name: "大家来抢钱",
        file: "大家来抢钱.html",
        icon: "💰",
        color: "rgba(47, 128, 237, 0.18)"
      },
      {
        name: "红帽小子大冒险",
        file: "red-hat-boy-game.html",
        icon: "🧢",
        color: "rgba(232, 85, 85, 0.18)"
      },
      {
        name: "红帽小子大冒险：飞鸟关卡",
        file: "red-hat-boy-game-bird-level.html",
        icon: "🪽",
        color: "rgba(47, 182, 109, 0.2)"
      },
      {
        name: "米宝的地洞惊喜游戏",
        file: "mibao_mole_bomb_diamond_game.html",
        icon: "💎",
        color: "rgba(142, 99, 255, 0.16)"
      },
      {
        name: "米宝口算大挑战",
        file: "米宝口算大挑战-单文件版.html",
        icon: "🧮",
        color: "rgba(245, 166, 35, 0.2)"
      },
      {
        name: "猫武士：猫族营地物语",
        file: "猫武士.html",
        icon: "🐾",
        color: "rgba(38, 166, 154, 0.18)"
      },
      {
        name: "恐龙跑酷游戏",
        file: "恐龙跑酷游戏.html",
        icon: "🦖",
        color: "rgba(126, 181, 67, 0.2)"
      }
    ];

    const gamesEl = document.getElementById("games");
    const gameCountEl = document.getElementById("gameCount");
    const familyPlayerSelect = document.getElementById("familyPlayerSelect");
    const PLAYER_STORAGE_KEY = "familyPlayer";
    const FAMILY_PLAYERS = ["爸爸", "婠婠", "米宝"];

    function loadFamilyPlayer() {
      try {
        const savedPlayer = localStorage.getItem(PLAYER_STORAGE_KEY);
        return FAMILY_PLAYERS.includes(savedPlayer) ? savedPlayer : FAMILY_PLAYERS[0];
      } catch (error) {
        return FAMILY_PLAYERS[0];
      }
    }

    familyPlayerSelect.value = loadFamilyPlayer();
    familyPlayerSelect.addEventListener("change", () => {
      const player = FAMILY_PLAYERS.includes(familyPlayerSelect.value)
        ? familyPlayerSelect.value
        : FAMILY_PLAYERS[0];
      familyPlayerSelect.value = player;
      try {
        localStorage.setItem(PLAYER_STORAGE_KEY, player);
      } catch (error) {
        console.warn("无法保存玩家选择", error);
      }
    });

    gameCountEl.textContent = games.length;

    if (games.length === 0) {
      gamesEl.className = "empty";
      gamesEl.textContent = "当前目录还没有识别到 HTML 游戏。";
    } else {
      gamesEl.innerHTML = games.map((game, index) => `
        <article class="game-card" style="--accent-soft: ${game.color}">
          <div class="game-art" aria-hidden="true">
            <div class="game-icon">${game.icon}</div>
            <div class="game-number">${String(index + 1).padStart(2, "0")}</div>
          </div>
          <div class="game-body">
            <h2 class="game-name">${game.name}</h2>
            <a class="start-button" href="${encodeURI(game.file)}">开始游戏</a>
          </div>
        </article>
      `).join("");
    }
  </script>
</body>
</html>
