    function healerDreamStory() {
      return {
        title: "🌙 巫医的梦",
        text: "巫医说梦见月光落在三片叶子上，像是在提醒族群保持团结。",
        choices: [
          { label: "听从梦的提示", effect: () => { state.cats.forEach(cat => cat.health = clamp(cat.health + 4, 0, 100)); log("你让族群一起清理营地、分享食物。大家精神更好了。", "剧情"); } },
          { label: "先记下来", kind: "secondary", effect: () => { state.food += 2; log("你把梦记在长老的故事里。当天狩猎队也带回了额外食物。", "剧情"); } }
        ]
      };
    }

    function helpClanStory() {
      const clan = pick(clans);
      return {
        title: "🤝 敌族请求帮助",
        text: `${clan}派来使者，请求借几份食物给生病的学徒。`,
        choices: [
          { label: "帮助它", effect: () => { state.food = Math.max(0, state.food - 4); changeRelation(clan, 12); log(`${state.clanName}分享了食物。${clan}记住了这份善意。`, "剧情"); } },
          { label: "拒绝它", kind: "warning", effect: () => { changeRelation(clan, -8); log(`你决定保留食物。${clan}有些失望。`, "剧情"); } },
          { label: "给一点点", kind: "secondary", effect: () => { state.food = Math.max(0, state.food - 2); changeRelation(clan, 5); log(`你送出两份食物，既帮助了对方，也保住了族群储备。`, "剧情"); } }
        ]
      };
    }

    function strangeScentStory() {
      const clan = pick(clans);
      return {
        title: "🍃 陌生气味",
        text: `边界出现了${clan}和流浪猫混在一起的气味。`,
        choices: [
          { label: "加强巡逻", effect: () => { changeRelation(clan, -4); state.cats.forEach(cat => { if (cat.role === "武士") cat.fighting = clamp(cat.fighting + 1, 0, 100); }); log("你加强边界巡逻，武士们更警觉了。", "剧情"); } },
          { label: "留下友好标记", kind: "secondary", effect: () => { changeRelation(clan, 5); log("你选择留下友好标记，边界气氛温和了一些。", "剧情"); } }
        ]
      };
    }

    function sickCatStory() {
      const restingCats = catsInCamp().filter(item => item.health > 15);
      const cat = pick(restingCats.length ? restingCats : state.cats.filter(item => item.health > 15)) || state.cats[0];
      return {
        title: "🌿 一只猫生病了",
        text: `${cat.name}今天没什么精神，需要照顾。`,
        choices: [
          { label: "让巫医照顾", effect: () => {
            if (state.herbs.catmint > 0) {
              state.herbs.catmint -= 1;
              cat.health = clamp(cat.health + 16, 0, 100);
              log(`巫医用了 1 份猫薄荷照顾${cat.name}，${cat.name}恢复了许多。`, "草药");
            } else if (state.herbs.marigold > 0) {
              state.herbs.marigold -= 1;
              cat.health = clamp(cat.health + 10, 0, 100);
              log(`猫薄荷不够，巫医用了 1 份金盏花照顾${cat.name}。`, "草药");
            } else {
              state.food = Math.max(0, state.food - 1);
              cat.health = clamp(cat.health + 5, 0, 100);
              log(`草药不够，巫医只能用温暖苔藓和食物照顾${cat.name}。`, "草药");
            }
          } },
          { label: "让它休息", kind: "secondary", effect: () => { cat.health = clamp(cat.health + 5, 0, 100); log(`${cat.name}在温暖的苔藓窝里休息，精神好了一些。`, "剧情"); } }
        ]
      };
    }

    function newPreyStory() {
      return {
        title: "🍖 新的猎物地点",
        text: "狩猎队发现一条通往浆果灌木的小路，那里有很多小动物脚印。",
        choices: [
          { label: "标记地点", effect: () => { state.discoveredPreySites += 1; log("族群标记了新的猎物地点，之后狩猎更容易成功。", "剧情"); } },
          { label: "今天就带回猎物", kind: "gold", effect: () => { const gain = rand(3, 6); state.food += gain; log(`狩猎队立刻行动，带回 ${gain} 份食物。`, "剧情"); } }
        ]
      };
    }

    function elderLegendStory() {
      return {
        title: "📖 长老的传说",
        text: "长老讲起很久以前星光照亮营地的故事，幼崽和学徒听得眼睛发亮。",
        choices: [
          { label: "让大家一起听", effect: () => { state.cats.forEach(cat => { if (cat.stage === "学徒") cat.fighting = clamp(cat.fighting + 2, 0, 100); }); log("学徒们从故事里学会了勇气和耐心。", "剧情"); } },
          { label: "请长老讲狩猎经验", kind: "secondary", effect: () => { state.cats.forEach(cat => { if (cat.stage === "学徒") cat.hunting = clamp(cat.hunting + 2, 0, 100); }); log("长老分享了辨认风向和脚印的经验，学徒们受益很多。", "剧情"); } }
        ]
      };
    }

    function apprenticeStory() {
      const apprentices = catsInCamp().filter(cat => cat.stage === "学徒");
      const cat = apprentices.length ? pick(apprentices) : pick(catsInCamp().length ? catsInCamp() : state.cats);
      return {
        title: "⭐ 学徒的请求",
        text: `${cat.name}希望提前参加武士考验。`,
        choices: [
          { label: "给它一次机会", effect: () => {
            if (cat.stage === "学徒" && cat.hunting + cat.fighting + rand(1, 50) > 120) {
              const oldName = cat.name;
              cat.nameRoot = cat.nameRoot || nameRootFrom(cat.name);
              cat.stage = "武士";
              cat.role = "武士";
              cat.name = makeName("武士", cat.nameRoot);
              log(`${oldName}通过考验，获得武士名${cat.name}，提前成为武士。`, "剧情");
            } else {
              cat.health = clamp(cat.health - 3, 0, 100);
              log(`${cat.name}尝试了考验，但还需要更多训练。`, "剧情");
            }
          } },
          { label: "继续训练", kind: "secondary", effect: () => { cat.hunting = clamp(cat.hunting + 3, 0, 100); cat.fighting = clamp(cat.fighting + 3, 0, 100); log(`你鼓励${cat.name}继续训练。它更加努力了。`, "剧情"); } }
        ]
      };
    }

    function mossNestStory() {
      return {
        title: "🌿 苔藓窝变旧了",
        text: "育婴窝和长老窝里的苔藓有些潮，大家睡得不太舒服。",
        choices: [
          { label: "换新苔藓", effect: () => { state.food = Math.max(0, state.food - 2); state.cats.forEach(cat => cat.health = clamp(cat.health + 3, 0, 100)); log("族猫们一起换了新苔藓。营地暖和又干爽，大家健康提升。", "剧情"); } },
          { label: "先晒一晒", kind: "secondary", effect: () => { const gain = rand(1, 3); state.food += gain; log(`你让学徒把苔藓搬到阳光下晾晒，顺便找到 ${gain} 份旧食物储备。`, "剧情"); } }
        ]
      };
    }

    function herbPatchStory() {
      const healer = catsInCamp().find(cat => cat.role === "巫医");
      return {
        title: "🌱 草药小坡",
        text: healer ? `${healer.name}在营地后面发现一片适合种草药的小坡。` : "族猫发现一片适合种草药的小坡，但需要细心照看。",
        choices: [
          { label: "照看草药", effect: () => { state.cats.forEach(cat => cat.health = clamp(cat.health + 4, 0, 100)); log("族群照看了草药小坡。清香的叶子让大家安心，健康提升。", "剧情"); } },
          { label: "先标记位置", kind: "secondary", effect: () => { state.discoveredPreySites += 1; log("你让巡逻队记住这片小坡的位置，也发现附近有不少小动物脚印。", "剧情"); } }
        ]
      };
    }

    function moonlitMeetingStory() {
      const clan = pick(clans);
      return {
        title: "🌙 月光下的会面",
        text: `${clan}邀请你的族群在月光下交换消息。`,
        choices: [
          { label: "派使者前往", effect: () => { changeRelation(clan, 8); log(`${state.clanName}派出使者参加会面。双方聊得很平静，${clan}关系提升。`, "剧情"); } },
          { label: "礼貌婉拒", kind: "secondary", effect: () => { changeRelation(clan, -2); state.food += 1; log("你决定让族猫留在营地休息。关系略有变化，营地多保留了 1 份食物。", "剧情"); } }
        ]
      };
    }

    function friendlyVisitorStory() {
      const clan = pick(clans);
      return {
        title: "🐾 友好的来访者",
        text: `一只来自${clan}的年轻猫带来问候，还想看看你的营地。`,
        choices: [
          { label: "欢迎它", effect: () => { changeRelation(clan, 6); state.food = Math.max(0, state.food - 1); log(`你欢迎了来访者，并分享了一点食物。${clan}对你更友好了。`, "剧情"); } },
          { label: "在边界交谈", kind: "secondary", effect: () => { changeRelation(clan, 3); log("你让巡逻队在边界礼貌交谈，保持了距离，也留下了好印象。", "剧情"); } }
        ]
      };
    }

    function nurseryGameStory() {
      const kits = catsInCamp().filter(cat => cat.stage === "幼崽");
      return {
        title: "🐱 幼崽的游戏",
        text: kits.length ? `${kits.map(cat => cat.name).join("、")}在育婴窝旁练习扑叶子。` : "营地里的小猫游戏让学徒想起自己小时候的训练。",
        choices: [
          { label: "让学徒陪玩", effect: () => { state.cats.forEach(cat => { if (cat.stage === "学徒") cat.fighting = clamp(cat.fighting + 2, 0, 100); }); log("学徒们陪幼崽玩扑叶子，也练习了灵活闪避。", "剧情"); } },
          { label: "让它们安静休息", kind: "secondary", effect: () => { state.cats.forEach(cat => { if (cat.stage === "幼崽") cat.health = clamp(cat.health + 5, 0, 100); }); log("幼崽们在暖和的窝里休息，精神更好了。", "剧情"); } }
        ]
      };
    }

    function quietDawnStory() {
      return {
        title: "🌤️ 安静的清晨",
        text: "晨雾很轻，营地外的草叶上有清亮露珠，是适合安排族群的一天。",
        choices: [
          { label: "早早巡查营地", effect: () => { state.food += 2; log("你带着族猫早早巡查营地，找到被树叶盖住的 2 份食物。", "剧情"); } },
          { label: "让大家多睡一会儿", kind: "secondary", effect: () => { state.cats.forEach(cat => cat.health = clamp(cat.health + 2, 0, 100)); log("族猫们多睡了一会儿，醒来后精神饱满。", "剧情"); } }
        ]
      };
    }

    function streamStoneStory() {
      return {
        title: "🪨 溪边石头松动",
        text: "边界小溪旁有几块石头松动，幼崽靠近可能会滑倒。",
        choices: [
          { label: "修好通道", effect: () => { state.food = Math.max(0, state.food - 2); state.cats.forEach(cat => { if (cat.stage === "幼崽") cat.health = clamp(cat.health + 3, 0, 100); }); log("族群搬稳了溪边石头。幼崽们以后经过那里更安全了。", "剧情"); } },
          { label: "设下提醒标记", kind: "secondary", effect: () => { state.cats.forEach(cat => { if (cat.stage === "学徒") cat.fighting = clamp(cat.fighting + 1, 0, 100); }); log("学徒们学会了设置提醒标记，边界经验增加。", "剧情"); } }
        ]
      };
    }

    function thornTunnelStory() {
      return {
        title: "🌵 刺藤小路",
        text: "营地旁的刺藤长得太密，但如果修好，也许能成为很好的防护。",
        choices: [
          { label: "修成防护墙", effect: () => { state.cats.forEach(cat => { if (["族长", "副族长", "武士"].includes(cat.role)) cat.fighting = clamp(cat.fighting + 1, 0, 100); }); log("武士们把刺藤修成防护墙，营地更稳固了。", "剧情"); } },
          { label: "开出狩猎小路", kind: "gold", effect: () => { state.discoveredPreySites += 1; log("族猫从刺藤旁开出一条小路，通向新的猎物地点。", "剧情"); } }
        ]
      };
    }

    function herbStockStory() {
      const herbKey = pick(["cobweb", "marigold", "catmint"]);
      const herbName = herbKey === "cobweb" ? "蜘蛛丝" : herbKey === "marigold" ? "金盏花" : "猫薄荷";
      return {
        title: "🌿 巫医检查草药",
        text: `巫医整理草药窝，说${herbName}快不够了。`,
        choices: [
          { label: "派猫采集", effect: () => { const amount = herbKey === "catmint" ? 1 : rand(1, 3); state.herbs[herbKey] += amount; log(`族猫找到 ${amount} 份${herbName}，巫医的库存增加了。`, "草药"); } },
          { label: "先节省使用", kind: "secondary", effect: () => { state.herbs.cobweb += 1; log("巫医重新整理草药窝，省出了 1 份蜘蛛丝。", "草药"); } }
        ]
      };
    }

    function kitQuestionStory() {
      const kit = pick(catsInCamp().filter(cat => cat.stage === "幼崽")) || pick(state.cats);
      return {
        title: "❓ 幼崽的问题",
        text: `${kit.name}仰头问：“族长，为什么边界不能随便越过去？”`,
        choices: [
          { label: "认真解释", effect: () => { changeAffection(kit, 7); state.threat = clamp(state.threat - 2, 0, 100); log(`你认真告诉${kit.name}边界规则。小家伙记住了。`, "剧情"); } },
          { label: "让长老讲故事", kind: "secondary", effect: () => { state.cats.forEach(cat => { if (cat.stage === "幼崽") changeAffection(cat, 3); }); log("长老用故事解释边界，幼崽们听得很认真。", "剧情"); } }
        ]
      };
    }

    function preyShareArgumentStory() {
      const a = pick(catsInCamp());
      const b = pick(catsInCamp().filter(cat => cat.id !== a?.id)) || a;
      return {
        title: "🍖 猎物分配的小争执",
        text: `${a.name}和${b.name}都想把一份好猎物留给自己喜欢的猫。`,
        choices: [
          { label: "公平分配", effect: () => { changeAffection(a, 4); changeAffection(b, 4); log("你公平分配猎物，两只猫都觉得族长很公正。", "剧情"); } },
          { label: "让它们自己商量", kind: "secondary", effect: () => { changeAffection(a, 1); changeAffection(b, 1); state.food += 1; log("它们自己商量后，还整理出 1 份多余食物。", "剧情"); } }
        ]
      };
    }

    function medicineCatRequestStory() {
      return {
        title: "🌼 巫医的请求",
        text: "巫医想把草药分成三小堆：蜘蛛丝处理伤口，金盏花照顾伤猫，猫薄荷照顾生病的猫。",
        choices: [
          { label: "帮忙整理", effect: () => { state.herbs.cobweb += 1; state.herbs.marigold += 1; log("你帮巫医整理草药，多找出 1 份蜘蛛丝和 1 份金盏花。", "草药"); } },
          { label: "记下用法", kind: "secondary", effect: () => { state.cats.forEach(cat => { if (cat.role === "巫医") changeAffection(cat, 5); }); log("你认真记下草药用法，巫医对族长更放心了。", "草药"); } }
        ]
      };
    }

    function borderLessonStory() {
      const clan = pick(clans);
      return {
        title: "🐾 边界教学",
        text: `学徒在${clan}边界附近闻到新气味，想知道该怎么判断。`,
        choices: [
          { label: "亲自教学", effect: () => { state.cats.forEach(cat => { if (cat.stage === "学徒") cat.fighting = clamp(cat.fighting + 2, 0, 100); }); log("你教会学徒分辨边界气味，学徒们更稳重了。", "剧情"); } },
          { label: "留下标记", kind: "secondary", effect: () => { changeRelation(clan, 2); log(`你留下清楚又礼貌的边界标记，${clan}没有误会。`, "剧情"); } }
        ]
      };
    }

    function hiddenDenStory() {
      return {
        title: "🏕️ 隐蔽小窝",
        text: "巡逻队发现一处被蕨叶挡住的小窝，适合躲雨或存放草药。",
        choices: [
          { label: "改成草药窝", effect: () => { state.herbs.cobweb += 2; state.herbs.marigold += 1; log("族群把小窝整理成草药窝，蜘蛛丝和金盏花库存增加。", "草药"); } },
          { label: "改成避雨处", kind: "secondary", effect: () => { state.cats.forEach(cat => cat.health = clamp(cat.health + 2, 0, 100)); log("小窝成了避雨处，族猫们更不容易着凉。", "剧情"); } }
        ]
      };
    }

    function owlShadowStory() {
      const cat = pick(catsInCamp().filter(item => item.stage !== "幼崽")) || state.cats[0];
      return {
        title: "🪽 树梢上的影子",
        text: `${cat.name}看见树梢有巨大的鸟影，提醒大家不要在空地久留。`,
        choices: [
          { label: "听它提醒", effect: () => { changeAffection(cat, 5); state.threat = clamp(state.threat - 2, 0, 100); log(`${cat.name}的提醒被重视，族群避开了空地。`, "剧情"); } },
          { label: "检查营地上方", kind: "secondary", effect: () => { state.herbs.cobweb += 1; log("你检查树根和枝丫，顺便收集到 1 份蜘蛛丝。", "草药"); } }
        ]
      };
    }

    function bindEvents() {
      els.startBtn.addEventListener("click", startGame);
      els.nextTurnBtn.addEventListener("click", nextTurn);
      els.huntBtn.addEventListener("click", () => setMode("hunt"));
      els.patrolBtn.addEventListener("click", () => setMode("patrol"));
      els.trainBtn.addEventListener("click", () => setMode("train"));
      els.confirmModeBtn.addEventListener("click", () => state.selectedMode === "hunt" ? doHunt() : state.selectedMode === "patrol" ? doPatrol() : state.selectedMode === "train" ? doTrain() : doTalk());
      els.cancelModeBtn.addEventListener("click", clearMode);
      els.showCatsBtn.addEventListener("click", () => els.catsPanel.scrollIntoView({ behavior: "smooth", block: "start" }));
      els.showLogBtn.addEventListener("click", () => els.logPanel.scrollIntoView({ behavior: "smooth", block: "start" }));
      document.querySelectorAll(".tab").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
          btn.classList.add("active");
          state.activeFilter = btn.dataset.filter;
          renderCats();
        });
      });
    }

    setupCampOptions();
    bindEvents();
  </script>
</body>
</html>
